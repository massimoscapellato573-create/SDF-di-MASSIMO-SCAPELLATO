<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pannello prenotazioni — darko.tats</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="admin-manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0b0c'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' font-weight='700' fill='%23c8a45c' text-anchor='middle'%3EPS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --bg-2:#141412; --bg-3:#1b1a17;
    --gold:#c8a45c; --gold-2:#e8cd8f; --gold-dim:#8a7141;
    --ink:#f4efe4; --muted:rgba(244,239,228,.62); --muted-2:rgba(244,239,228,.4);
    --line:rgba(200,164,92,.22);
    --ok:#4caf7d; --ok-2:#8fe0b5; --no:#c96a6a; --no-2:#e39a9a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Jost',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
  .serif{font-family:'Cinzel',serif}
  .wrap{max-width:920px;margin:0 auto;padding:32px clamp(18px,4vw,40px) 80px}
  button,input{font-family:'Jost',sans-serif}
  a{color:var(--gold-2)}

  /* login */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:360px;border:1px solid var(--line);padding:40px 32px;background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,164,92,.07), transparent 70%)}
  .login-card h1{font-family:'Cinzel',serif;font-size:1.3rem;text-align:center;margin-bottom:6px}
  .login-card .sub{text-align:center;color:var(--muted-2);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:6px}
  .field input{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;font-size:.92rem}
  .field input:focus{outline:none;border-color:var(--gold)}
  .btn{display:block;width:100%;background:var(--gold);color:var(--bg);border:0;padding:13px;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;cursor:pointer;margin-top:22px;transition:background .2s}
  .btn:hover{background:var(--gold-2)}
  .btn:disabled{opacity:.5;cursor:default}
  .form-err{color:var(--no-2);font-size:.82rem;margin-top:14px;text-align:center;display:none}

  /* dashboard */
  .dash{display:none}
  header.dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:14px}
  header.dash-head h1{font-family:'Cinzel',serif;font-size:1.4rem}
  header.dash-head .sub{color:var(--muted-2);font-size:.78rem;letter-spacing:.06em}
  .logout{background:none;border:1px solid var(--line);color:var(--muted);padding:9px 16px;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:border-color .2s,color .2s}
  .logout:hover{border-color:var(--gold);color:var(--gold-2)}
  .head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .push-btn{background:var(--gold);color:var(--bg);border:0;padding:9px 16px;font-size:.76rem;font-weight:600;letter-spacing:.03em;cursor:pointer;font-family:'Jost',sans-serif}
  .push-btn:hover{background:var(--gold-2)}
  .push-btn:disabled{opacity:.5;cursor:default}
  .push-btn.on{background:none;border:1px solid var(--ok);color:var(--ok-2)}
  .push-note{color:var(--muted-2);font-size:.78rem;margin:-4px 0 14px;max-width:480px}

  .tabs{display:flex;gap:8px;margin:28px 0 22px;flex-wrap:wrap}
  .tab{background:none;border:1px solid var(--line);color:var(--muted);padding:9px 16px;font-size:.78rem;letter-spacing:.04em;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
  .tab .n{opacity:.6;margin-left:5px}
  .tab.active{border-color:var(--gold);color:var(--gold-2);background:rgba(200,164,92,.08)}

  .empty{color:var(--muted-2);text-align:center;padding:60px 20px;font-size:.92rem}

  .req-card{border:1px solid var(--line);padding:20px 22px;margin-bottom:14px;background:var(--bg-2)}
  .req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .req-top .who b{font-family:'Cinzel',serif;font-size:1.05rem;font-weight:600;display:block}
  .req-top .who a{font-size:.84rem;color:var(--muted);text-decoration:none}
  .req-top .who a:hover{color:var(--gold-2)}
  .req-when{text-align:right;font-family:'Cinzel',serif;color:var(--gold-2);font-size:.95rem}
  .req-when small{display:block;font-family:'Jost',sans-serif;color:var(--muted-2);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .req-idea{color:var(--muted);font-size:.88rem;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .req-idea.empty-idea{font-style:italic;color:var(--muted-2)}
  .req-meta{color:var(--muted-2);font-size:.7rem;letter-spacing:.04em;margin-top:10px}
  .req-status{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:100px;margin-top:10px}
  .req-status.ok{border:1px solid var(--ok);color:var(--ok-2)}
  .req-status.wait{border:1px solid var(--gold-dim);color:var(--gold-2)}
  .req-status.no{border:1px solid var(--no);color:var(--no-2)}
  .req-status b{font-family:'Jost',sans-serif}

  .req-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .a-accept{background:var(--ok);color:#0c2417;border:0;padding:10px 18px;font-size:.8rem;font-weight:600;letter-spacing:.04em;cursor:pointer}
  .a-reject{background:none;border:1px solid var(--no);color:var(--no-2);padding:10px 18px;font-size:.8rem;letter-spacing:.04em;cursor:pointer}
  .a-paid{background:var(--gold);color:var(--bg);border:0;padding:10px 18px;font-size:.8rem;font-weight:600;letter-spacing:.04em;cursor:pointer}
  .a-accept:hover,.a-paid:hover{opacity:.9}
  .a-reject:hover{background:rgba(201,106,106,.1)}
  .a-delete{background:none;border:0;color:var(--muted-2);font-size:.74rem;letter-spacing:.03em;text-decoration:underline;cursor:pointer;padding:10px 4px}
  .a-delete:hover{color:var(--no-2)}
  .accept-form{display:none;gap:10px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);flex-wrap:wrap}
  .accept-form input{width:130px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:9px 12px;font-size:.88rem}
  .accept-form .confirm{background:var(--ok);color:#0c2417;border:0;padding:9px 16px;font-size:.8rem;font-weight:600;cursor:pointer}
  .accept-form .cancel{background:none;border:0;color:var(--muted-2);font-size:.78rem;text-decoration:underline;cursor:pointer}

  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:8px;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

  /* ---------- CALENDARIO ---------- */
  .cal-wrap{border:1px solid var(--line);padding:clamp(18px,3vw,30px);background:var(--bg-2)}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .cal-head .lbl{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--gold-2);text-transform:capitalize}
  .cal-nav{background:none;border:1px solid var(--line);color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.05rem;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s}
  .cal-nav:hover{border-color:var(--gold);color:var(--gold-2)}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-day-cell{aspect-ratio:1;min-width:0;min-height:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-family:'Jost',sans-serif;font-size:.86rem;border-radius:5px;transition:border-color .2s,background .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
  .cal-day-cell.empty{visibility:hidden;pointer-events:none;border:0}
  .cal-day-cell.sun{opacity:.35;cursor:default}
  .cal-day-cell:hover:not(.sun){border-color:var(--gold-dim)}
  .cal-day-cell.sel{border-color:var(--gold);background:rgba(200,164,92,.14)}
  .cal-day-cell .dots{display:flex;gap:2px}
  .cal-day-cell .dots span{width:5px;height:5px;border-radius:50%}
  .dot-wait{background:var(--gold-dim)}
  .dot-ok{background:var(--ok)}
  .dot-block{background:var(--no)}

  .agenda{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .agenda h3{font-family:'Cinzel',serif;font-size:1rem;margin-bottom:16px;text-transform:capitalize}
  .agenda-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .agenda-row:last-child{border-bottom:0}
  .agenda-time{font-family:'Cinzel',serif;color:var(--gold-2);font-size:.9rem;width:60px;flex:none}
  .agenda-info{flex:1;font-size:.86rem;color:var(--muted)}
  .agenda-info .tag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;margin-right:8px}
  .agenda-info .tag.ok{color:var(--ok-2)}
  .agenda-info .tag.wait{color:var(--gold-2)}
  .agenda-info .tag.block{color:var(--no-2)}
  .agenda-free{color:var(--muted-2);font-style:italic;font-size:.86rem}
  .a-block{background:none;border:1px solid var(--line);color:var(--muted);padding:7px 14px;font-size:.76rem;letter-spacing:.03em;cursor:pointer;transition:border-color .2s,color .2s}
  .a-block:hover{border-color:var(--gold);color:var(--gold-2)}
  .a-unblock{background:none;border:1px solid var(--no);color:var(--no-2);padding:7px 14px;font-size:.76rem;letter-spacing:.03em;cursor:pointer}
  .a-unblock:hover{background:rgba(201,106,106,.1)}

  .day-tools{display:flex;flex-direction:column;gap:12px;padding:16px;margin-bottom:18px;border:1px solid var(--line);background:var(--bg)}
  .a-block-day{background:var(--gold);color:var(--bg);border:0;padding:10px 16px;font-size:.8rem;font-weight:600;letter-spacing:.03em;cursor:pointer;align-self:flex-start}
  .a-block-day:hover{background:var(--gold-2)}
  .range-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .range-lbl{font-size:.78rem;color:var(--muted-2)}
  .range-tools select{background:var(--bg-2);border:1px solid var(--line);color:var(--ink);padding:7px 8px;font-size:.82rem;font-family:'Jost',sans-serif}
  .a-block-range{background:none;border:1px solid var(--gold-dim);color:var(--gold-2);padding:8px 14px;font-size:.78rem;letter-spacing:.03em;cursor:pointer}
  .a-block-range:hover{border-color:var(--gold);background:rgba(200,164,92,.08)}

  /* ---------- MODALE (al posto di confirm()/prompt() nativi, non affidabili
     nei browser interni tipo WhatsApp) ---------- */
  .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(6,6,7,.82);display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.open{display:flex}
  .modal-box{width:100%;max-width:380px;border:1px solid var(--line);background:var(--bg-2);padding:26px}
  .modal-box p{font-size:.92rem;color:var(--ink);line-height:1.5;margin-bottom:18px}
  .modal-box input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:11px 13px;font-size:.9rem;margin-bottom:18px}
  .modal-box input:focus{outline:none;border-color:var(--gold)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}
  .modal-actions button{border:0;padding:10px 18px;font-size:.8rem;letter-spacing:.03em;cursor:pointer;font-family:'Jost',sans-serif}
  .modal-cancel{background:none;border:1px solid var(--line) !important;color:var(--muted)}
  .modal-cancel:hover{border-color:var(--gold-dim) !important}
  .modal-ok{background:var(--gold);color:var(--bg);font-weight:600}
  .modal-ok:hover{background:var(--gold-2)}
  .modal-ok.danger{background:var(--no);color:#2a0d0d}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>darko.tats</h1>
    <p class="sub">Pannello prenotazioni</p>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">Accedi</button>
    <p class="form-err" id="loginErr"></p>
  </div>
</div>

<div class="dash" id="dash">
  <div class="wrap">
    <header class="dash-head">
      <div>
        <h1>Richieste appuntamento</h1>
        <p class="sub"><span class="live-dot"></span>aggiornamento in tempo reale</p>
      </div>
      <div class="head-actions">
        <button class="push-btn" id="pushBtn" style="display:none">🔔 Attiva notifiche</button>
        <button class="logout" id="logoutBtn">Esci</button>
      </div>
    </header>
    <p class="push-note" id="pushNote" style="display:none"></p>

    <div class="tabs">
      <button class="tab active" data-tab="in_attesa">In attesa <span class="n" id="cWait">0</span></button>
      <button class="tab" data-tab="accettata">Da pagare <span class="n" id="cToPay">0</span></button>
      <button class="tab" data-tab="confermata">Confermate <span class="n" id="cConfirmed">0</span></button>
      <button class="tab" data-tab="rifiutata">Rifiutate <span class="n" id="cNo">0</span></button>
      <button class="tab" data-tab="tutte">Tutte</button>
      <button class="tab" data-tab="calendario">Calendario</button>
    </div>

    <div id="list"></div>
    <div id="calView" style="display:none"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <p id="modalMsg"></p>
    <input type="text" id="modalInput" style="display:none">
    <div class="modal-actions">
      <button type="button" class="modal-cancel" id="modalCancel">Annulla</button>
      <button type="button" class="modal-ok" id="modalOk">Conferma</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  const sb = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  const loginScreen = document.getElementById('loginScreen');
  const dash = document.getElementById('dash');
  const loginBtn = document.getElementById('loginBtn');
  const loginErr = document.getElementById('loginErr');

  const fmtDay = new Intl.DateTimeFormat('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
  const fmtEuro = (n) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(n);
  const fmtWhen = (created) => new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(created));

  let allReqs = [];
  let activeTab = 'in_attesa';

  /* Sostituiscono confirm()/prompt() nativi: non sempre affidabili nei
     browser interni (es. quello di WhatsApp). Restituiscono una Promise. */
  const modalOverlay = document.getElementById('modalOverlay');
  const modalMsg = document.getElementById('modalMsg');
  const modalInput = document.getElementById('modalInput');
  const modalCancel = document.getElementById('modalCancel');
  const modalOk = document.getElementById('modalOk');

  function openModal({ message, withInput, placeholder, danger, okLabel }) {
    return new Promise((resolve) => {
      modalMsg.textContent = message;
      modalInput.style.display = withInput ? 'block' : 'none';
      modalInput.value = '';
      modalInput.placeholder = placeholder || '';
      modalOk.textContent = okLabel || 'Conferma';
      modalOk.classList.toggle('danger', !!danger);
      modalOverlay.classList.add('open');
      if (withInput) setTimeout(() => modalInput.focus(), 50);

      function cleanup(result) {
        modalOverlay.classList.remove('open');
        modalOk.removeEventListener('click', onOk);
        modalCancel.removeEventListener('click', onCancel);
        modalOverlay.removeEventListener('click', onOverlay);
        resolve(result);
      }
      function onOk() { cleanup(withInput ? (modalInput.value.trim() || null) : true); }
      function onCancel() { cleanup(withInput ? undefined : false); }
      function onOverlay(e) { if (e.target === modalOverlay) onCancel(); }
      modalOk.addEventListener('click', onOk);
      modalCancel.addEventListener('click', onCancel);
      modalOverlay.addEventListener('click', onOverlay);
    });
  }
  function showConfirm(message, danger) {
    return openModal({ message, danger, okLabel: danger ? 'Sì, procedi' : 'Conferma' });
  }
  function showPromptModal(message, placeholder) {
    return openModal({ message, withInput: true, placeholder, okLabel: 'Blocca' });
  }

  async function doLogin() {
    loginErr.style.display = 'none';
    if (!sb) {
      loginErr.textContent = 'Impossibile connettersi in questo momento. Controlla la connessione e ricarica la pagina.';
      loginErr.style.display = 'block';
      return;
    }
    loginBtn.disabled = true;
    loginBtn.textContent = 'Accesso in corso…';
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('loginEmail').value.trim(),
      password: document.getElementById('loginPass').value
    });
    loginBtn.disabled = false;
    loginBtn.textContent = 'Accedi';
    if (error) {
      loginErr.textContent = 'Email o password non corrette.';
      loginErr.style.display = 'block';
      return;
    }
    enterDash();
  }
  loginBtn.addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });

  async function enterDash() {
    loginScreen.style.display = 'none';
    dash.style.display = 'block';
    await refresh();
    sb.channel('richieste-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'richieste' }, () => {
        refresh();
        notify();
      })
      .subscribe();
    setupPush();
  }

  /* ---------- Notifiche push (funzionano anche a pannello chiuso) ---------- */
  const pushBtn = document.getElementById('pushBtn');
  const pushNote = document.getElementById('pushNote');

  function urlBase64ToUint8Array(base64) {
    const padding = '='.repeat((4 - (base64.length % 4)) % 4);
    const b64 = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b64);
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
  }

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);

  async function setupPush() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      pushNote.textContent = 'Le notifiche push non sono supportate su questo browser.';
      pushNote.style.display = 'block';
      return;
    }
    if (isIos && !isStandalone()) {
      pushNote.textContent = 'Per attivare le notifiche su iPhone: tocca "Condividi" in Safari → "Aggiungi a Home", poi apri il pannello dall\'icona sulla schermata Home e torna qui.';
      pushNote.style.display = 'block';
      return;
    }

    pushBtn.style.display = 'inline-block';
    const reg = await navigator.serviceWorker.register('sw.js');
    const existing = await reg.pushManager.getSubscription();
    setPushBtnState(!!existing);

    pushBtn.addEventListener('click', async () => {
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        pushBtn.disabled = true;
        await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
        await sub.unsubscribe();
        setPushBtnState(false);
        pushBtn.disabled = false;
        return;
      }
      pushBtn.disabled = true;
      pushBtn.textContent = 'Attivazione…';
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          pushNote.textContent = 'Permesso negato: attiva le notifiche per questo sito dalle impostazioni del browser.';
          pushNote.style.display = 'block';
          setPushBtnState(false);
          return;
        }
        const newSub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
        const json = newSub.toJSON();
        const { error } = await sb.from('push_subscriptions').insert({
          endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth
        });
        if (error && error.code !== '23505') throw error;
        setPushBtnState(true);
      } catch (e) {
        pushNote.textContent = 'Non sono riuscito ad attivare le notifiche. Riprova tra poco.';
        pushNote.style.display = 'block';
        setPushBtnState(false);
      } finally {
        pushBtn.disabled = false;
      }
    });
  }

  function setPushBtnState(active) {
    pushBtn.classList.toggle('on', active);
    pushBtn.textContent = active ? '🔔 Notifiche attive' : '🔔 Attiva notifiche';
  }

  function notify() {
    if (Notification && Notification.permission === 'granted') {
      new Notification('darko.tats — nuova richiesta', { body: 'Controlla il pannello prenotazioni.' });
    }
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 720; g.gain.value = 0.06;
      o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 180);
    } catch (e) {}
  }
  if (window.Notification && Notification.permission === 'default') {
    document.body.addEventListener('click', () => Notification.requestPermission(), { once: true });
  }

  async function refresh() {
    const { data, error } = await sb.from('richieste').select('*').order('giorno', { ascending: true }).order('ora', { ascending: true });
    if (error) { console.error(error); return; }
    allReqs = data || [];
    document.getElementById('cWait').textContent = allReqs.filter(r => r.stato === 'in_attesa').length;
    document.getElementById('cToPay').textContent = allReqs.filter(r => r.stato === 'accettata').length;
    document.getElementById('cConfirmed').textContent = allReqs.filter(r => r.stato === 'confermata').length;
    document.getElementById('cNo').textContent = allReqs.filter(r => r.stato === 'rifiutata').length;
    render();
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;
    render();
  }));

  function render() {
    const list = document.getElementById('list');
    const calView = document.getElementById('calView');
    if (activeTab === 'calendario') {
      list.style.display = 'none';
      calView.style.display = 'block';
      renderCalendar();
      return;
    }
    list.style.display = 'block';
    calView.style.display = 'none';

    const clientReqs = allReqs.filter(r => r.stato !== 'bloccato');
    const items = activeTab === 'tutte' ? clientReqs : clientReqs.filter(r => r.stato === activeTab);
    if (!items.length) {
      list.innerHTML = '<p class="empty">Nessuna richiesta qui.</p>';
      return;
    }
    list.innerHTML = items.map(r => cardHtml(r)).join('');
    items.forEach(r => wireCard(r));
  }

  function cardHtml(r) {
    const idea = r.idea ? `<div class="req-idea">${escapeHtml(r.idea)}</div>` : `<div class="req-idea empty-idea">Nessuna idea descritta</div>`;
    let statusBadge = '';
    let actions = '';
    if (r.stato === 'accettata') {
      statusBadge = `<span class="req-status wait">In attesa di pagamento · acconto <b>${fmtEuro(r.acconto_importo)}</b></span>`;
      actions = `<div class="req-actions"><button class="a-paid" data-id="${r.id}" data-action="mark-paid">Segna come pagato</button></div>`;
    } else if (r.stato === 'confermata') {
      statusBadge = `<span class="req-status ok">Confermata · acconto <b>${fmtEuro(r.acconto_importo)}</b></span>`;
    } else if (r.stato === 'rifiutata') {
      statusBadge = `<span class="req-status no">Rifiutata</span>`;
    } else {
      actions = `
        <div class="req-actions">
          <button class="a-accept" data-id="${r.id}" data-action="show-accept">Accetta</button>
          <button class="a-reject" data-id="${r.id}" data-action="reject">Rifiuta</button>
        </div>
        <div class="accept-form" id="accept-${r.id}">
          <input type="number" min="0" step="5" id="amt-${r.id}" placeholder="Acconto €">
          <button class="confirm" data-id="${r.id}" data-action="confirm-accept">Conferma</button>
          <button class="cancel" data-id="${r.id}" data-action="cancel-accept">annulla</button>
        </div>`;
    }
    return `
      <div class="req-card">
        <div class="req-top">
          <div class="who">
            <b>${escapeHtml(r.nome)}</b>
            <a href="tel:${escapeHtml(r.telefono)}">${escapeHtml(r.telefono)}</a>
          </div>
          <div class="req-when">${fmtDay.format(new Date(r.giorno + 'T00:00:00'))}<small>${r.ora}</small></div>
        </div>
        ${idea}
        <p class="req-meta">Richiesta inviata il ${fmtWhen(r.created_at)}</p>
        ${statusBadge}
        ${actions}
        <div class="req-actions"><button class="a-delete" data-id="${r.id}" data-action="delete">Elimina richiesta</button></div>
      </div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function wireCard(r) {
    const el = document.querySelector(`[data-id="${r.id}"][data-action="show-accept"]`);
    if (el) el.addEventListener('click', () => {
      document.getElementById(`accept-${r.id}`).style.display = 'flex';
    });
    const cancelEl = document.querySelector(`[data-id="${r.id}"][data-action="cancel-accept"]`);
    if (cancelEl) cancelEl.addEventListener('click', () => {
      document.getElementById(`accept-${r.id}`).style.display = 'none';
    });
    const confirmEl = document.querySelector(`[data-id="${r.id}"][data-action="confirm-accept"]`);
    if (confirmEl) confirmEl.addEventListener('click', async () => {
      const val = parseFloat(document.getElementById(`amt-${r.id}`).value);
      if (!val || val <= 0) { alert('Inserisci un importo valido.'); return; }
      confirmEl.disabled = true;
      const { error } = await sb.from('richieste').update({ stato: 'accettata', acconto_importo: val }).eq('id', r.id);
      if (error) { alert(error.code === '23505' ? 'Questo orario è già occupato da un\'altra richiesta accettata o bloccata.' : 'Errore, riprova.'); confirmEl.disabled = false; return; }
      refresh();
    });
    const rejectEl = document.querySelector(`[data-id="${r.id}"][data-action="reject"]`);
    if (rejectEl) rejectEl.addEventListener('click', async () => {
      if (!(await showConfirm(`Rifiutare la richiesta di ${r.nome}?`))) return;
      await sb.from('richieste').update({ stato: 'rifiutata' }).eq('id', r.id);
      refresh();
    });
    const paidEl = document.querySelector(`[data-id="${r.id}"][data-action="mark-paid"]`);
    if (paidEl) paidEl.addEventListener('click', async () => {
      if (!(await showConfirm(`Confermare che ${r.nome} ha versato l'acconto di ${fmtEuro(r.acconto_importo)}?`))) return;
      await sb.from('richieste').update({ stato: 'confermata' }).eq('id', r.id);
      refresh();
    });
    const delEl = document.querySelector(`[data-id="${r.id}"][data-action="delete"]`);
    if (delEl) delEl.addEventListener('click', async () => {
      if (!(await showConfirm(`Eliminare definitivamente la richiesta di ${r.nome || 'questo appuntamento'}?`, true))) return;
      await sb.from('richieste').delete().eq('id', r.id);
      refresh();
    });
  }

  /* ---------- Vista Calendario ---------- */
  const fmtMonthYear = new Intl.DateTimeFormat('it-IT', { month: 'long', year: 'numeric' });
  const fmtDayFull = new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  let calViewYear = new Date().getFullYear();
  let calViewMonth = new Date().getMonth();
  let calSelDate = null;

  function renderCalendar() {
    const calView = document.getElementById('calView');
    const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const byDay = {};
    allReqs.forEach(r => {
      if (r.stato === 'rifiutata') return;
      (byDay[r.giorno] = byDay[r.giorno] || []).push(r);
    });

    const firstDay = new Date(calViewYear, calViewMonth, 1);
    const leadEmpty = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();

    let cells = '';
    for (let i = 0; i < leadEmpty; i++) cells += `<div class="cal-day-cell empty"></div>`;
    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(calViewYear, calViewMonth, day);
      const key = iso(date);
      const isSun = date.getDay() === 0;
      const items = byDay[key] || [];
      const hasWait = items.some(r => r.stato === 'in_attesa');
      const hasOk = items.some(r => r.stato === 'accettata' || r.stato === 'confermata');
      const hasBlock = items.some(r => r.stato === 'bloccato');
      const dots = [hasWait && '<span class="dot-wait"></span>', hasOk && '<span class="dot-ok"></span>', hasBlock && '<span class="dot-block"></span>'].filter(Boolean).join('');
      const sel = calSelDate === key ? ' sel' : '';
      cells += `<button type="button" class="cal-day-cell${isSun ? ' sun' : ''}${sel}" data-date="${key}" ${isSun ? 'disabled' : ''}>${day}<span class="dots">${dots}</span></button>`;
    }

    calView.innerHTML = `
      <div class="cal-wrap">
        <div class="cal-head">
          <button type="button" class="cal-nav" id="calAdminPrev">‹</button>
          <span class="lbl">${fmtMonthYear.format(firstDay)}</span>
          <button type="button" class="cal-nav" id="calAdminNext">›</button>
        </div>
        <div class="cal-weekdays"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div>
        <div class="cal-grid">${cells}</div>
        <div id="calAgenda"></div>
      </div>`;

    document.getElementById('calAdminPrev').addEventListener('click', () => {
      calViewMonth--; if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
      renderCalendar();
    });
    document.getElementById('calAdminNext').addEventListener('click', () => {
      calViewMonth++; if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
      renderCalendar();
    });
    calView.querySelectorAll('.cal-day-cell[data-date]').forEach(btn => {
      btn.addEventListener('click', () => {
        // Aggiorna solo la selezione e l'agenda sotto, senza ricostruire
        // tutta la griglia: su alcuni browser mobile ricreare l'intera
        // griglia ad ogni tocco causava un disegno sporco/sovrapposto.
        calView.querySelectorAll('.cal-day-cell.sel').forEach(x => x.classList.remove('sel'));
        btn.classList.add('sel');
        calSelDate = btn.dataset.date;
        renderAgenda(calSelDate, byDay[calSelDate] || []);
      });
    });

    if (calSelDate) renderAgenda(calSelDate, byDay[calSelDate] || []);
  }

  function renderAgenda(dateKey, items) {
    const agenda = document.getElementById('calAgenda');
    const dateObj = new Date(dateKey + 'T00:00:00');
    const freeSlots = [];
    let rows = '';
    for (let h = 10; h <= 18; h++) {
      const t = h + ':00';
      const match = items.find(r => r.ora === t);
      let info;
      if (!match) {
        freeSlots.push(t);
        info = `<span class="agenda-free">Libero</span> <button type="button" class="a-block" data-block-date="${dateKey}" data-block-time="${t}">Blocca</button>`;
      } else if (match.stato === 'bloccato') {
        info = `<span class="tag block">Bloccato</span>${escapeHtml(match.idea || 'nessun motivo indicato')} <button type="button" class="a-unblock" data-unblock-id="${match.id}">Sblocca</button>`;
      } else if (match.stato === 'in_attesa') {
        info = `<span class="tag wait">Richiesta in attesa</span>${escapeHtml(match.nome)}`;
      } else if (match.stato === 'accettata') {
        info = `<span class="tag wait">Da pagare</span>${escapeHtml(match.nome)}`;
      } else {
        info = `<span class="tag ok">Confermato</span>${escapeHtml(match.nome)}`;
      }
      rows += `<div class="agenda-row"><span class="agenda-time">${t}</span><span class="agenda-info">${info}</span></div>`;
    }
    const hourOptions = () => {
      let o = '';
      for (let h = 10; h <= 18; h++) o += `<option value="${h}">${h}:00</option>`;
      return o;
    };
    const dayTools = freeSlots.length ? `
      <div class="day-tools">
        <button type="button" class="a-block-day" id="blockWholeDay">Blocca tutta la giornata</button>
        <div class="range-tools">
          <span class="range-lbl">oppure da</span>
          <select id="rangeFrom">${hourOptions()}</select>
          <span class="range-lbl">a</span>
          <select id="rangeTo">${hourOptions()}</select>
          <button type="button" class="a-block-range" id="blockRangeBtn">Blocca intervallo</button>
        </div>
      </div>` : '';
    agenda.innerHTML = `<div class="agenda"><h3>${fmtDayFull.format(dateObj)}</h3>${dayTools}${rows}</div>`;

    async function blockSlots(hours, question) {
      const motivo = await showPromptModal(question, 'Es. Sessione lunga, ferie…');
      if (motivo === undefined) return; // annullato
      let skipped = 0;
      for (const h of hours) {
        const t = h + ':00';
        const { error } = await sb.from('richieste').insert({ giorno: dateKey, ora: t, idea: motivo, stato: 'bloccato' });
        if (error) skipped++;
      }
      if (skipped) alert(`${skipped} orario/i risultavano già occupati e non sono stati bloccati.`);
      refresh();
    }

    const rangeToSel = document.getElementById('rangeTo');
    if (rangeToSel) rangeToSel.value = '18';

    const wholeDayBtn = document.getElementById('blockWholeDay');
    if (wholeDayBtn) wholeDayBtn.addEventListener('click', () => {
      const hours = freeSlots.map(t => parseInt(t, 10));
      blockSlots(hours, `Bloccare tutti i ${freeSlots.length} orari liberi di ${fmtDayFull.format(dateObj)}? Utile per un tatuaggio lungo che occupa più ore.`);
    });

    const rangeBtn = document.getElementById('blockRangeBtn');
    if (rangeBtn) rangeBtn.addEventListener('click', () => {
      const from = parseInt(document.getElementById('rangeFrom').value, 10);
      const to = parseInt(document.getElementById('rangeTo').value, 10);
      if (from > to) { alert('L\'orario "da" deve essere prima o uguale a "a".'); return; }
      const hours = [];
      for (let h = from; h <= to; h++) hours.push(h);
      blockSlots(hours, `Bloccare gli orari dalle ${from}:00 alle ${to}:00 di ${fmtDayFull.format(dateObj)}?`);
    });

    agenda.querySelectorAll('[data-block-date]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const motivo = await showPromptModal('Motivo del blocco (facoltativo):', 'Es. Ferie, impegno personale…');
        if (motivo === undefined) return; // annullato
        const { error } = await sb.from('richieste').insert({
          giorno: btn.dataset.blockDate, ora: btn.dataset.blockTime, idea: motivo, stato: 'bloccato'
        });
        if (error) { alert(error.code === '23505' ? 'Questo orario è già occupato.' : 'Errore, riprova.'); return; }
        refresh();
      });
    });
    agenda.querySelectorAll('[data-unblock-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!(await showConfirm('Sbloccare questo orario?'))) return;
        await sb.from('richieste').delete().eq('id', btn.dataset.unblockId);
        refresh();
      });
    });
  }

  /* Se una sessione è già attiva, entra direttamente */
  if (sb) {
    sb.auth.getSession().then(({ data }) => {
      if (data.session) enterDash();
    });
  }
</script>

</body>
</html>
