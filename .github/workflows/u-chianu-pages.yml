name: Deploy U Chianu 2.0 to Pages

on:
  push:
    branches: ["claude/u-chianu-website-issue-u7emdw"]
    paths: ["u-chianu-2-0/**", ".github/workflows/u-chianu-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'u-chianu-2-0'
      - id: deployment
        uses: actions/deploy-pages@v4
