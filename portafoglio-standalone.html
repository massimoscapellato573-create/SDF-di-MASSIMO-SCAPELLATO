<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#0E1116;
  --bg-2:#151A22;
  --surface:#1B212B;
  --surface-2:#232A36;
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.18);
  --txt:#EEF2F7;
  --txt-dim:#9AA6B6;
  --txt-faint:#6B7787;
  --danger:#E5534B;
  --radius:20px;
  --shadow:0 24px 60px -24px rgba(0,0,0,.8);

  /* sovrascritti dal "tier" (livello di ricchezza) */
  --accent:#8C97A8;
  --accent-2:#5E6878;
  --glow:rgba(140,151,168,.25);
  --sat:1;
}

/* --- LIVELLI DI RICCHEZZA ------------------------------- */
body[data-tier="broke"]{
  --accent:#7B8494; --accent-2:#4B5361; --glow:rgba(123,132,148,.18); --sat:.55;
}
body[data-tier="medio"]{
  --accent:#5B8FD4; --accent-2:#3C6AA8; --glow:rgba(91,143,212,.28); --sat:.9;
}
body[data-tier="bene"]{
  --accent:#4CB782; --accent-2:#2E8C5F; --glow:rgba(76,183,130,.32); --sat:1;
}
body[data-tier="ricco"]{
  --accent:#E3B341; --accent-2:#B8862A; --glow:rgba(227,179,65,.4); --sat:1.08;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--txt);
  line-height:1.5;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  transition:background .6s ease;
}
/* alone di colore che segue il livello di ricchezza */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(90% 60% at 50% -10%, var(--glow), transparent 70%),
    linear-gradient(180deg, var(--bg-2), var(--bg) 45%);
  transition:background .8s ease;
}
.mono{font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:.66rem}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:1rem;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent);color:#0E1116}

.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 18px 120px}
.hidden{display:none !important}

/* ============================================================
   SCHERMATA DI BLOCCO
   ============================================================ */
.lock{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(180deg,#151A22,#0E1116);
  display:grid;place-items:center;padding:28px;
}
.lock-inner{width:100%;max-width:340px;text-align:center}
.lock-badge{
  width:76px;height:76px;margin:0 auto 22px;border-radius:24px;
  background:linear-gradient(145deg,var(--surface-2),var(--surface));
  border:1px solid var(--line-strong);
  display:grid;place-items:center;box-shadow:var(--shadow);
}
.lock-badge svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.8}
.lock h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.lock p{color:var(--txt-dim);font-size:.92rem;margin-bottom:26px}

.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:24px;min-height:16px}
.pin-dot{width:13px;height:13px;border-radius:50%;border:1.6px solid var(--line-strong);transition:.2s}
.pin-dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.key{
  height:62px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
  font-size:1.35rem;font-weight:600;transition:transform .12s, background .18s;
  display:grid;place-items:center;-webkit-tap-highlight-color:transparent;
}
.key:active{transform:scale(.94);background:var(--surface-2)}
.key.fn{font-size:.8rem;font-weight:600;color:var(--txt-dim);letter-spacing:.02em}
.key.ok{background:var(--accent);color:#0E1116;border-color:transparent}
.key.ok:disabled{opacity:.3;cursor:default}

.lock-msg{min-height:22px;font-size:.86rem;color:var(--txt-dim)}
.lock-msg.err{color:var(--danger)}
.shake{animation:shake .4s}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
}
.lock-note{margin-top:20px;font-size:.74rem;color:var(--txt-faint);line-height:1.6}

/* ============================================================
   TESTATA + SALDO
   ============================================================ */
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 6px}
.top .mono{color:var(--txt-faint)}
.top-actions{display:flex;gap:6px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface);transition:.2s;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.icon-btn svg{width:18px;height:18px;stroke:var(--txt-dim);fill:none;stroke-width:1.8}

.balance{text-align:center;padding:26px 0 8px}
.balance-label{color:var(--txt-faint);margin-bottom:10px}
.balance-amount{
  font-size:clamp(3rem,15vw,4.6rem);font-weight:800;letter-spacing:-.045em;line-height:1;
  color:var(--accent);text-shadow:0 0 60px var(--glow);
  font-variant-numeric:tabular-nums;transition:color .6s ease;
}
.balance-amount .cents{font-size:.45em;font-weight:700;opacity:.6;letter-spacing:-.02em}

.tier-pill{
  display:inline-flex;align-items:center;gap:9px;margin-top:18px;
  padding:9px 18px;border-radius:100px;
  background:var(--surface);border:1px solid var(--line-strong);
}
.tier-emoji{font-size:1.1rem;line-height:1}
.tier-text strong{display:block;font-size:.94rem;font-weight:700;letter-spacing:-.01em}
.tier-text span{display:block;font-size:.76rem;color:var(--txt-dim);line-height:1.35}

/* ============================================================
   LE MAZZETTE (i soldi visti "veri")
   ============================================================ */
.stacks-section{margin-top:38px}
.sec-title{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin-bottom:16px;padding:0 2px;
}
.sec-title .mono{color:var(--txt-faint)}
.sec-title .hint{font-size:.76rem;color:var(--txt-faint);text-align:right}

.stacks{
  background:linear-gradient(160deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 20px 22px;box-shadow:var(--shadow);
  filter:saturate(var(--sat));transition:filter .6s ease;
}
.stacks-row{
  display:flex;flex-wrap:wrap;gap:26px 20px;align-items:flex-end;justify-content:center;
  min-height:120px;
}

/* una mazzetta = pila di banconote dello stesso taglio */
.bundle{display:flex;flex-direction:column;align-items:center;gap:9px}
.bundle-pile{position:relative;width:96px}
.bundle-pile .note{
  position:relative;width:96px;height:52px;border-radius:5px;
  border:1px solid rgba(0,0,0,.35);
  box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 2px 4px rgba(0,0,0,.4);
  display:grid;place-items:center;
  /* sovrapposizione: si vede il bordo di ogni singola banconota.
     --step lo decide il JS: pile alte = banconote più strette. */
  margin-top:calc(var(--step,7px) - 52px);
}
.bundle-pile .note:first-child{margin-top:0}
.note-val{
  font-family:'Space Mono',monospace;font-weight:700;font-size:.82rem;
  color:rgba(0,0,0,.62);text-shadow:0 1px 0 rgba(255,255,255,.35);
  transform:translateY(-1px);
}
.note::after{ /* filigrana/riga della banconota */
  content:"";position:absolute;left:8%;right:8%;top:50%;height:1px;
  background:rgba(0,0,0,.14);
}
/* fascetta di carta come nelle mazzette vere */
.bundle-pile.banded::before{
  content:"";position:absolute;left:-5px;right:-5px;top:50%;height:15px;
  transform:translateY(-50%) rotate(-1.2deg);
  background:linear-gradient(180deg,#F4EFE3,#D9D0BC);
  border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.45);z-index:9;
}
.bundle-pile.banded::after{
  content:attr(data-band);position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%) rotate(-1.2deg);z-index:10;
  font-family:'Space Mono',monospace;font-size:.56rem;font-weight:700;
  letter-spacing:.08em;color:#3B342A;text-align:center;
}
.bundle-label{
  font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.06em;
  color:var(--txt-dim);white-space:nowrap;
}
.bundle-label b{color:var(--txt)}

.coins{display:flex;align-items:center;gap:-6px;padding-bottom:4px}
.coin{
  width:30px;height:30px;border-radius:50%;margin-right:-9px;
  background:radial-gradient(circle at 34% 30%,#F0DFA8,#C9A227 55%,#8E6F14);

<script>
"use strict";

/* ============================================================
   1. COSTANTI
   ============================================================ */
const STORE_KEY   = "portafoglio.v1";
const PBKDF2_ITER = 250000;
const AUTOLOCK_MS = 3 * 60 * 1000;   // blocco dopo 3 minuti di inattività
const REVEAL_MS   = 12 * 1000;       // per quanto resta visibile il numero carta

/* Tagli reali degli euro, con i colori veri delle banconote.
   Il taglio da 500 non c'è: la BCE ha smesso di emetterlo nel 2019,
   e in mano non lo vedresti mai. Così il mucchio è quello vero. */
const TAGLI = [
  { v:200, top:"#E8D98A", bot:"#C9A83F" },
  { v:100, top:"#9BD1A0", bot:"#5E9E68" },
  { v:50,  top:"#F0B979", bot:"#D08A38" },
  { v:20,  top:"#93B8E8", bot:"#4E7EC0" },
  { v:10,  top:"#E8A09B", bot:"#C25A52" },
  { v:5,   top:"#C4CBD4", bot:"#8A939F" },
];

/* Livelli di ricchezza — le soglie che hai chiesto */
const TIERS = [
  { id:"broke", min:0,   emoji:"🥲", title:"Sopravvivenza",  sub:"Sotto i 50€. Ogni caffè conta davvero." },
  { id:"medio", min:50,  emoji:"😐", title:"Ti mantieni",    sub:"Non sei a terra, ma non esagerare." },
  { id:"bene",  min:100, emoji:"😎", title:"Stai andando bene", sub:"Sopra i 100€. Puoi respirare." },
  { id:"ricco", min:300, emoji:"🤑", title:"Sei ricco",      sub:"Sopra i 300€. Goditela, ma con testa." },
];

const COLORI = [
  "linear-gradient(135deg,#1E3A5F,#0F1E33)",
  "linear-gradient(135deg,#2E5C4A,#12301F)",
  "linear-gradient(135deg,#5C2E3A,#2B0F18)",
  "linear-gradient(135deg,#4A3B6B,#1E1531)",
  "linear-gradient(135deg,#6B5424,#2E2210)",
  "linear-gradient(135deg,#333B47,#12161C)",
];

/* ============================================================
   2. CIFRATURA (AES-256-GCM, chiave derivata dal PIN)
   Il PIN non viene mai salvato: si salva solo il dato cifrato.
   ============================================================ */
const enc = new TextEncoder();
const dec = new TextDecoder();

const b64 = {
  to:  buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
  from: str => Uint8Array.from(atob(str), c => c.charCodeAt(0)),
};

async function derivaChiave(pin, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:PBKDF2_ITER, hash:"SHA-256" },
    base,
    { name:"AES-GCM", length:256 },
    false,
    ["encrypt","decrypt"]
  );
}

async function cifra(dati, chiave){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, chiave, enc.encode(JSON.stringify(dati)));
  return { iv:b64.to(iv), ct:b64.to(ct) };
}

async function decifra(pacchetto, chiave){
  const testo = await crypto.subtle.decrypt(
    { name:"AES-GCM", iv:b64.from(pacchetto.iv) }, chiave, b64.from(pacchetto.ct)
  );
  return JSON.parse(dec.decode(testo));
}

/* ============================================================
   3. STATO
   ============================================================ */
let chiave = null;          // chiave AES, vive solo in memoria
let stato  = { carte: [] };
let pinBuf = "";
let modo   = "unlock";      // "setup" | "unlock" | "conferma" | "nuovoPin" | "confermaNuovoPin"
let pinTmp = "";
let tentativi = 0;
let timerAutolock = null;

const $  = id => document.getElementById(id);
const dischiRoot = $("sheets");

function leggiArchivio(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)); }
  catch { return null; }
}
function esisteArchivio(){
  const a = leggiArchivio();
  return !!(a && a.salt && a.ct);
}
async function salva(){
  const archivio = leggiArchivio();
  const pacchetto = await cifra(stato, chiave);
  localStorage.setItem(STORE_KEY, JSON.stringify({
    v:1, salt:archivio.salt, iv:pacchetto.iv, ct:pacchetto.ct, agg:Date.now()
  }));
}

/* ============================================================
   4. SCHERMATA DI BLOCCO
   ============================================================ */
function disegnaPin(){
  $("pinDots").innerHTML = pinBuf.split("").map(() => '<span class="pin-dot on"></span>').join("")
    || '<span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>';
  $("pinOk").disabled = pinBuf.length < 4;
}

function messaggio(testo, errore){
  const el = $("lockMsg");
  el.textContent = testo || "";
  el.classList.toggle("err", !!errore);
}

function impostaModo(nuovo){
  modo = nuovo;
  pinBuf = "";
  disegnaPin();
  const t = $("lockTitle"), s = $("lockSub");
  if (modo === "setup"){
    t.textContent = "Crea il tuo PIN";
    s.textContent = "Almeno 4 cifre. Serve solo a te per aprire il portafoglio.";
  } else if (modo === "conferma"){
    t.textContent = "Ripeti il PIN";
    s.textContent = "Per essere sicuri che te lo ricordi.";
  } else if (modo === "nuovoPin"){
    t.textContent = "Nuovo PIN";
    s.textContent = "Scegli il nuovo codice.";
  } else if (modo === "confermaNuovoPin"){
    t.textContent = "Ripeti il nuovo PIN";
    s.textContent = "Ancora una volta.";
  } else {
    t.textContent = "Il Mio Portafoglio";
    s.textContent = "Inserisci il PIN per entrare";
  }
}

document.querySelectorAll(".key").forEach(k => {
  k.addEventListener("click", () => {
    const v = k.dataset.k;
    if (v === "del")      pinBuf = pinBuf.slice(0, -1);
    else if (v === "ok")  return inviaPin();
    else if (pinBuf.length < 12) pinBuf += v;
    messaggio("");
    disegnaPin();
  });
});

document.addEventListener("keydown", e => {
  if ($("lock").classList.contains("hidden")) return;
  if (/^[0-9]$/.test(e.key) && pinBuf.length < 12){ pinBuf += e.key; messaggio(""); disegnaPin(); }
  else if (e.key === "Backspace"){ pinBuf = pinBuf.slice(0, -1); disegnaPin(); }
  else if (e.key === "Enter" && pinBuf.length >= 4) inviaPin();
});

async function inviaPin(){
  if (pinBuf.length < 4) return;

  /* --- primo avvio: creazione PIN --- */
  if (modo === "setup"){
    pinTmp = pinBuf;
    impostaModo("conferma");
    return;
  }
  if (modo === "conferma"){
    if (pinBuf !== pinTmp){
      scuoti(); messaggio("I due PIN non coincidono. Riprova.", true);
      pinTmp = ""; impostaModo("setup");
      return;
    }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    chiave = await derivaChiave(pinTmp, salt);
    stato  = { carte: [] };
    const pacchetto = await cifra(stato, chiave);
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v:1, salt:b64.to(salt), iv:pacchetto.iv, ct:pacchetto.ct, agg:Date.now()
    }));
    pinTmp = "";
    entra();
    return;
  }

  /* --- cambio PIN dall'interno --- */
  if (modo === "nuovoPin"){
    pinTmp = pinBuf;
    impostaModo("confermaNuovoPin");
    return;
  }
  if (modo === "confermaNuovoPin"){
    if (pinBuf !== pinTmp){
      scuoti(); messaggio("I due PIN non coincidono.", true);
      pinTmp = ""; impostaModo("nuovoPin");
      return;
    }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    chiave = await derivaChiave(pinTmp, salt);
    const pacchetto = await cifra(stato, chiave);
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v:1, salt:b64.to(salt), iv:pacchetto.iv, ct:pacchetto.ct, agg:Date.now()
    }));
    pinTmp = "";
    entra();
    avviso("PIN aggiornato");
    return;
  }

  /* --- sblocco normale --- */
  messaggio("Apertura…");
  const archivio = leggiArchivio();
  try {
    const k = await derivaChiave(pinBuf, b64.from(archivio.salt));
    stato = await decifra({ iv:archivio.iv, ct:archivio.ct }, k);
    if (!stato || !Array.isArray(stato.carte)) throw new Error("dati non validi");
    chiave = k;
    tentativi = 0;
    entra();
  } catch {
    tentativi++;
    scuoti();
    pinBuf = ""; disegnaPin();
    messaggio(tentativi >= 3 ? `PIN errato (${tentativi} tentativi)` : "PIN errato", true);
    /* piccolo ritardo crescente: rende inutile provare a tentoni */
    if (tentativi >= 3){
      const attesa = Math.min(tentativi - 2, 5);
      document.querySelectorAll(".key").forEach(k => k.disabled = true);
      setTimeout(() => document.querySelectorAll(".key").forEach(k => {
        k.disabled = (k.id === "pinOk");
      }), attesa * 1000);
    }
  }
}

function scuoti(){
  const el = $("lockInner");
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
}

function entra(){
  $("lock").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("btnAdd").classList.remove("hidden");
  pinBuf = ""; messaggio("");
  disegna();
  resetAutolock();
}

function blocca(){
  chiave = null;
  stato  = { carte: [] };
  pinBuf = "";
  clearTimeout(timerAutolock);
  chiudiTutto();
  /* ripulisco anche quello che è già disegnato: bloccando non deve
     restare traccia delle carte nella pagina nascosta */
  $("cards").innerHTML = "";
  $("stacksRow").innerHTML = "";
  $("stacksFoot").innerHTML = "";
  $("cardCount").textContent = "";
  $("totale").textContent = "€0";
  $("sparkles").innerHTML = "";
  document.body.dataset.tier = "medio";
  $("app").classList.add("hidden");
  $("btnAdd").classList.add("hidden");
  $("sparkles").classList.add("hidden");
  $("lock").classList.remove("hidden");
  impostaModo("unlock");
}

function resetAutolock(){
  clearTimeout(timerAutolock);
  if (chiave) timerAutolock = setTimeout(blocca, AUTOLOCK_MS);
}
["click","keydown","touchstart","scroll"].forEach(ev =>
  document.addEventListener(ev, () => { if (chiave) resetAutolock(); }, { passive:true })
);

$("btnLock").addEventListener("click", blocca);

/* ============================================================
   5. UTILITÀ
   ============================================================ */
const euro = n => new Intl.NumberFormat("it-IT", {
  style:"currency", currency:"EUR", minimumFractionDigits:2
}).format(n);

function totale(){
  return stato.carte.reduce((s, c) => s + (Number(c.saldo) || 0), 0);
}

function livello(t){
  let out = TIERS[0];
  for (const x of TIERS) if (t >= x.min) out = x;
  return out;
}

function circuito(num){
  const n = (num || "").replace(/\D/g, "");
  if (/^4/.test(n)) return "Visa";
  if (/^(5[1-5]|2[2-7])/.test(n)) return "Mastercard";
  if (/^3[47]/.test(n)) return "American Express";
  if (/^(6011|65|64[4-9])/.test(n)) return "Discover";
  if (/^3(0[0-5]|[68])/.test(n)) return "Diners";
  return "Carta";
}

/* Algoritmo di Luhn: controlla se il numero è formalmente valido */
function luhnOk(num){
  const n = (num || "").replace(/\D/g, "");
  if (n.length < 12) return false;
  let somma = 0, alterna = false;
  for (let i = n.length - 1; i >= 0; i--){
    let d = +n[i];
    if (alterna){ d *= 2; if (d > 9) d -= 9; }
    somma += d;
    alterna = !alterna;
  }
  return somma % 10 === 0;
}

function mascheraNum(num){
  const n = (num || "").replace(/\D/g, "");
  if (!n) return "•••• •••• •••• ••••";
  return "•••• •••• •••• " + n.slice(-4).padStart(4, "•");
}
function spazia(num){
  return (num || "").replace(/\D/g, "").replace(/(.{4})/g, "$1 ").trim();
}
const pulisci = s => String(s ?? "").replace(/[<>&"']/g, c =>
  ({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;", "'":"&#39;" }[c]));

function avviso(testo){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = testo;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ============================================================
   6. LE MAZZETTE — il cuore della cosa
   Scompone il totale in banconote vere, così vedi quanto è.
   ============================================================ */
function scomponi(tot){
  let resto = Math.round(tot * 100);   // in centesimi, per non sbagliare gli arrotondamenti
  const pezzi = [];
  for (const t of TAGLI){
    const cent = t.v * 100;
    const n = Math.floor(resto / cent);
    if (n > 0){ pezzi.push({ ...t, n }); resto -= n * cent; }
  }
  return { pezzi, spiccioli: resto / 100 };
}

function disegnaMazzette(tot){
  const row  = $("stacksRow");
  const foot = $("stacksFoot");

  if (tot <= 0){
    row.innerHTML = '<div class="stacks-empty">Zero contanti.<br>Le banconote appaiono appena aggiungi del saldo.</div>';
    foot.innerHTML = "";
    return;
  }

  const { pezzi, spiccioli } = scomponi(tot);
  let html = "";

  for (const p of pezzi){
    /* Disegno fino a 22 banconote: il mucchio deve pesare all'occhio.
       Più sono, più le stringo, se no la pila diventa altissima. */
    const disegnate = Math.min(p.n, 22);
    const step = p.n > 14 ? 4 : p.n > 8 ? 5.5 : 7;
    const note = Array.from({ length: disegnate }, () =>
      `<div class="note" style="background:linear-gradient(160deg,${p.top},${p.bot})">
         <span class="note-val">${p.v}</span>
       </div>`).join("");

    /* come in banca: da 10 banconote in su la mazzetta ha la fascetta di carta */
    const fascia = p.n >= 10
      ? `class="bundle-pile banded" data-band="${euro(p.v * p.n).replace(/ /g, " ")}"`
      : 'class="bundle-pile"';

    html += `
      <div class="bundle">
        <div ${fascia} style="--step:${step}px">${note}</div>
        <div class="bundle-label"><b>${p.n}×</b> da ${p.v}€</div>
      </div>`;
  }

  if (spiccioli > 0){
    const nMonete = Math.min(Math.max(Math.round(spiccioli), 1), 5);
    html += `
      <div class="bundle">
        <div class="coins">${'<div class="coin"></div>'.repeat(nMonete)}</div>
        <div class="bundle-label">e <b>${euro(spiccioli)}</b> di spicci</div>
      </div>`;
  }

  row.innerHTML = html;

  /* frase di confronto: quante banconote da 50 sono in totale */
  const da50 = Math.floor(tot / 50);
  foot.innerHTML = da50 >= 1
    ? `In mano sarebbero <b>${da50}</b> banconot${da50 === 1 ? "a" : "e"} da 50€${da50 === 1 ? "" : " impilate"}.`
    : `Non arrivi nemmeno a <b>una banconota da 50€</b>.`;
}

/* ============================================================
   7. DISEGNO DELL'INTERFACCIA
   ============================================================ */
function disegna(){
  const tot = totale();
  const lv  = stato.carte.length ? livello(tot) : null;

  /* saldo, con i centesimi più piccoli */
  const [intero, cent] = euro(tot).replace("€", "").trim().split(",");
  $("totale").innerHTML = `€${intero}<span class="cents">,${cent}</span>`;

  /* livello di ricchezza → cambia tutto il colore della pagina */
  document.body.dataset.tier = lv ? lv.id : "medio";
  $("tierEmoji").textContent = lv ? lv.emoji : "💤";
  $("tierTitle").textContent = lv ? lv.title : "Portafoglio vuoto";
  $("tierSub").textContent   = lv ? lv.sub   : "Aggiungi la tua prima carta";

  /* effetto "sei ricco" */
  $("sparkles").classList.toggle("hidden", !lv || lv.id !== "ricco");
  if (lv && lv.id === "ricco") creaScintille();

  disegnaMazzette(tot);

  /* conteggio carte */
  const n = stato.carte.length;
  $("cardCount").textContent = n ? `${n} cart${n === 1 ? "a" : "e"}` : "";

  /* elenco carte */
  const box = $("cards");
  if (!n){
    box.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>
        <p>Nessuna carta ancora. Aggiungi la prima e vedrai subito quanto hai davvero.</p>
      </div>`;
    return;
  }

  box.innerHTML = stato.carte.map(c => `
    <div class="card-wrap">
      <div class="card" style="background:${c.colore}">
        <div class="card-top">
          <div>
            <div class="card-name">${pulisci(c.nome)}</div>
            <div class="card-circuit">${pulisci(c.circuito || "Carta")}</div>
          </div>
          <div class="card-chip"></div>
        </div>
        <div class="card-num" data-num-id="${c.id}">
          <span data-num>${mascheraNum(c.numero)}</span>
          ${c.numero ? `<button class="reveal-btn" data-reveal="${c.id}">Mostra</button>` : ""}
        </div>
        <div class="card-bottom">
          <div>
            <div class="card-holder">${pulisci(c.intestatario || "—")}</div>
            ${c.scadenza ? `<div class="card-exp">Scad. ${pulisci(c.scadenza)}</div>` : ""}
          </div>
          <div class="card-saldo">
            <div class="lbl">Saldo</div>
            <div class="val">${euro(c.saldo || 0)}</div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="card-act" data-mov="${c.id}">± Soldi</button>
        <button class="card-act" data-edit="${c.id}">Modifica</button>
        <button class="card-act del" data-del="${c.id}">Elimina</button>
      </div>
    </div>`).join("");
}

function creaScintille(){
  const box = $("sparkles");
  if (box.childElementCount) return;
  for (let i = 0; i < 18; i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random() * 100 + "%";
    s.style.bottom = "-12px";
    s.style.animationDuration = (7 + Math.random() * 7) + "s";
    s.style.animationDelay = (Math.random() * 8) + "s";
    box.appendChild(s);
  }
}

/* --- aggiungi / modifica carta --- */
function schedaCarta(id){

    <div class="field">

      </div>
      <div class="field">
        <label for="fScad">Scadenza</label>
        <input id="fScad" inputmode="numeric" placeholder="MM/AA" value="${pulisci(c?.scadenza || "")}" maxlength="5">
      </div>
    </div>
    <div class="field" style="margin-top:-8px">
      <div class="help">
        Il numero viene cifrato come tutto il resto e resta mostrato mascherato.
        <b>Il CVV non si può inserire</b>: è l'unica cosa che rende clonabile una carta, e qui non serve a niente.
      </div>
    </div>

    <div class="field">
      <label>Colore</label>
      <div class="swatches" id="fColori" role="radiogroup">
        ${COLORI.map((col, i) => `
          <button type="button" class="swatch" role="radio"
            aria-checked="${c ? c.colore === col : i === 0}"
            data-col="${col}" style="background:${col}"
            aria-label="Colore ${i + 1}"></button>`).join("")}
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="fAnnulla">Annulla</button>
      <button class="btn btn-primary" id="fSalva">${c ? "Salva" : "Aggiungi"}</button>
    </div>
  `);

  /* selezione colore */
  let colore = c?.colore || COLORI[0];
  s.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => {
    s.querySelectorAll(".swatch").forEach(x => x.setAttribute("aria-checked", "false"));
    b.setAttribute("aria-checked", "true");
    colore = b.dataset.col;
  }));

  /* formattazione automatica mentre scrivi */
  const inNum = s.querySelector("#fNum");
  inNum.addEventListener("input", () => {
    const p = inNum.value.replace(/\D/g, "").slice(0, 19);
    inNum.value = p.replace(/(.{4})/g, "$1 ").trim();
  });
  const inScad = s.querySelector("#fScad");
  inScad.addEventListener("input", () => {
    let p = inScad.value.replace(/\D/g, "").slice(0, 4);
    if (p.length >= 3) p = p.slice(0, 2) + "/" + p.slice(2);
    inScad.value = p;
  });

  s.querySelector("#fAnnulla").addEventListener("click", () => s.remove());

  s.querySelector("#fSalva").addEventListener("click", async () => {
    const nome  = s.querySelector("#fNome").value.trim();
    const grezz = s.querySelector("#fSaldo").value.trim().replace(/\./g, "").replace(",", ".");
    const saldo = parseFloat(grezz);
    const numero = inNum.value.replace(/\D/g, "");

    const errori = [];
    if (!nome) errori.push("Dai un nome alla carta.");
    if (grezz === "" || isNaN(saldo)) errori.push("Scrivi quanto c'è sulla carta.");
    else if (saldo < 0) errori.push("Il saldo non può essere negativo.");
    else if (saldo > 99999999) errori.push("Cifra troppo grande.");

    if (errori.length){
      s.querySelector("#fErr").innerHTML = `<div class="err-msg">${errori.join(" ")}</div>`;
      return;
    }

    /* controllo Luhn: avvisa, ma non blocca */
    if (numero && !luhnOk(numero)){
      const box = s.querySelector("#fErr");
      if (!box.dataset.avvisato){
        box.innerHTML = `<div class="warn-msg">Quel numero non sembra un numero di carta valido. Se è giusto lo stesso, premi di nuovo "Salva".</div>`;

        return;
      }
    }

    const dati = {
      id: c?.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
      nome,
      intestatario: s.querySelector("#fIntest").value.trim(),
      numero,
      circuito: numero ? circuito(numero) : (c?.circuito || "Carta"),
      scadenza: inScad.value.trim(),
      saldo: Math.round(saldo * 100) / 100,
      colore,
    };

    if (c) stato.carte[stato.carte.findIndex(x => x.id === c.id)] = dati;
    else   stato.carte.push(dati);

    await salva();
    s.remove();
    disegna();
    avviso(c ? "Carta aggiornata" : "Carta aggiunta");
  });

  setTimeout(() => s.querySelector("#fNome").focus(), 120);
}

/* --- movimento rapido: metti o togli soldi --- */
function schedaMovimento(id){
  const c = stato.carte.find(x => x.id === id);
  if (!c) return;
  let delta = 0;

  const s = apri(`
    <h2>${pulisci(c.nome)}</h2>
    <p style="color:var(--txt-dim);font-size:.88rem;margin-top:-12px;margin-bottom:6px">
      Adesso: <b style="color:var(--txt)">${euro(c.saldo)}</b>
    </p>
    <div class="mov-amount" id="mNuovo">${euro(c.saldo)}</div>
    <p style="text-align:center;color:var(--txt-faint);font-size:.78rem;margin-bottom:16px" id="mDelta">nessuna modifica</p>

    <div class="mov-quick">
      ${[-50, -20, -10, -5].map(v => `<button class="mov-chip" data-d="${v}">${v}€</button>`).join("")}
    </div>
    <div class="mov-quick">
      ${[5, 10, 20, 50, 100].map(v => `<button class="mov-chip" data-d="${v}">+${v}€</button>`).join("")}
    </div>

    <div class="field">
      <label for="mExact">Oppure scrivi il saldo esatto (€)</label>
      <input id="mExact" type="text" inputmode="decimal" placeholder="${String(c.saldo).replace(".", ",")}">
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="mAnnulla">Annulla</button>
      <button class="btn btn-primary" id="mSalva">Salva</button>
    </div>
  `);

  const inExact = s.querySelector("#mExact");

  function aggiorna(){
    const nuovo = Math.max(0, Math.round((c.saldo + delta) * 100) / 100);
    s.querySelector("#mNuovo").textContent = euro(nuovo);
    const d = s.querySelector("#mDelta");
    d.textContent = delta === 0 ? "nessuna modifica"
      : (delta > 0 ? `+${euro(delta)}` : `${euro(delta)}`);
    d.style.color = delta === 0 ? "var(--txt-faint)" : (delta > 0 ? "#4CB782" : "#E5534B");
  }

  s.querySelectorAll(".mov-chip").forEach(b => b.addEventListener("click", () => {
    delta = Math.round((delta + Number(b.dataset.d)) * 100) / 100;
    inExact.value = "";
    aggiorna();
  }));

  inExact.addEventListener("input", () => {
    const v = parseFloat(inExact.value.replace(/\./g, "").replace(",", "."));
    delta = isNaN(v) ? 0 : Math.round((v - c.saldo) * 100) / 100;
    aggiorna();
  });

  s.querySelector("#mAnnulla").addEventListener("click", () => s.remove());
  s.querySelector("#mSalva").addEventListener("click", async () => {
    c.saldo = Math.max(0, Math.round((c.saldo + delta) * 100) / 100);
    await salva();
    s.remove();
    disegna();
    avviso("Saldo aggiornato");
  });
}

      </button>
    </div>

      <button class="btn btn-ghost" id="mChiudi">Chiudi</button>
    </div>
  `);

  s.querySelector("#mChiudi").addEventListener("click", () => s.remove());

  /* copia di riserva: si esporta il blob già cifrato, mai i dati in chiaro */
  s.querySelector("#mBackup").addEventListener("click", () => {
    const archivio = localStorage.getItem(STORE_KEY);
    if (!archivio) return;
    const url = URL.createObjectURL(new Blob([archivio], { type:"application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `portafoglio-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);

  s.querySelector("#mRipristina").addEventListener("click", () => {
    const inp = document.createElement("input");

    inp.accept = "application/json,.json";
    inp.addEventListener("change", async () => {
      const f = inp.files[0];
      if (!f) return;
      try {
        const testo = await f.text();
        const dati = JSON.parse(testo);
        if (!dati.salt || !dati.ct || !dati.iv) throw new Error("file non valido");
        localStorage.setItem(STORE_KEY, testo);
        s.remove();
        avviso("Copia ripristinata — rientra col PIN di quel backup");
        blocca();
      } catch {
        avviso("File non valido");
      }
    });
    inp.click();
  });

  s.querySelector("#mPin").addEventListener("click", () => {
    s.remove();
    $("app").classList.add("hidden");
    $("btnAdd").classList.add("hidden");
    $("lock").classList.remove("hidden");
    impostaModo("nuovoPin");
  });

  s.querySelector("#mReset").addEventListener("click", () => {
    s.remove();
    const c = apri(`
      <h2>Cancellare tutto?</h2>
      <p style="color:var(--txt-dim);font-size:.92rem;margin-bottom:8px">
        Spariscono <b style="color:var(--txt)">${stato.carte.length} cart${stato.carte.length === 1 ? "a" : "e"}</b>
        e il tuo PIN. Il portafoglio riparte da zero.
      </p>
      <div class="warn-msg">Se non hai salvato una copia, non c'è modo di recuperare.</div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="rNo">Annulla</button>
        <button class="btn btn-danger" id="rSi">Cancella tutto</button>
      </div>
    `);
    c.querySelector("#rNo").addEventListener("click", () => c.remove());
    c.querySelector("#rSi").addEventListener("click", () => {
      localStorage.removeItem(STORE_KEY);
      c.remove();
      chiave = null;
      stato = { carte: [] };
      $("app").classList.add("hidden");
      $("btnAdd").classList.add("hidden");
      $("lock").classList.remove("hidden");
      impostaModo("setup");
    });
  });
}

/* ============================================================
   9. EVENTI
   ============================================================ */
$("btnAdd").addEventListener("click", () => schedaCarta(null));
$("btnMenu").addEventListener("click", schedaMenu);

$("cards").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.mov)  return schedaMovimento(b.dataset.mov);
  if (b.dataset.edit) return schedaCarta(b.dataset.edit);
  if (b.dataset.del)  return schedaElimina(b.dataset.del);

  /* mostra il numero per pochi secondi, poi lo rimaschera da solo */
  if (b.dataset.reveal){
    const id = b.dataset.reveal;
    const c  = stato.carte.find(x => x.id === id);
    const box = document.querySelector(`[data-num-id="${id}"] [data-num]`);
    if (!c || !box) return;
    if (b.dataset.on === "1"){
      box.textContent = mascheraNum(c.numero);
      b.textContent = "Mostra";
      b.dataset.on = "0";
      clearTimeout(b._t);
    } else {
      box.textContent = spazia(c.numero);
      b.textContent = "Nascondi";
      b.dataset.on = "1";
      b._t = setTimeout(() => {
        box.textContent = mascheraNum(c.numero);
        b.textContent = "Mostra";
        b.dataset.on = "0";
      }, REVEAL_MS);
    }
  }
});

/* Esc chiude il pannello aperto */
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    const ultimo = dischiRoot.lastElementChild;
    if (ultimo) ultimo.remove();
  }
});

/* se metti l'app in background, si richiude da sola dopo un po' */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && chiave){
    clearTimeout(timerAutolock);
    timerAutolock = setTimeout(blocca, 30 * 1000);
  } else if (chiave) {
    resetAutolock();
  }
});

/* ============================================================
   10. AVVIO
   ============================================================ */
(function avvio(){
  if (!crypto?.subtle){
    $("lockSub").textContent = "Questo browser non supporta la cifratura. Apri la pagina in HTTPS o su un browser aggiornato.";
    document.querySelectorAll(".key").forEach(k => k.disabled = true);
    return;
  }
  impostaModo(esisteArchivio() ? "unlock" : "setup");
})();
</script>
